name: Auto Update YouTube Videos

on:
  schedule:
    # 日常定時每 12 小時自動執行輕量更新
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      sync_mode:
        description: '選擇同步模式：full_backfill (一次過補齊出道至今所有舊片) / incremental (只檢查最新片)'
        required: true
        default: 'full_backfill'
        type: choice
        options:
          - full_backfill
          - incremental

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-package-lock --legacy-peer-deps

      - name: Run YouTube Sync Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'incremental' }}
        run: node scripts/fetch-youtube.cjs
