name: Auto Update YouTube Videos

on:
  schedule:
    # 每天 UTC 時間 00:00 與 12:00（香港時間早上 8 點與晚上 8 點）自動執行
    - cron: '0 0,12 * * *'
  # 支援手動立即測試
  workflow_dispatch:

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝 Supabase 依賴
        run: npm install @supabase/supabase-js --no-package-lock --legacy-peer-deps

      - name: 執行更新腳本
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-youtube.mjs
